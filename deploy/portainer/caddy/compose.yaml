services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: |
      cat > /etc/caddy/Caddyfile <<'CADDYFILE'
      {$$FE_DOMAIN} {
        encode zstd gzip
        reverse_proxy {$$FE_UPSTREAM}
      }

      {$$API_DOMAIN} {
        encode zstd gzip
        reverse_proxy horse-be:8000
      }

      {$$AUTH_DOMAIN} {
        encode zstd gzip
        reverse_proxy horse-keycloak:8080
      }

      {$$S3_DOMAIN} {
        reverse_proxy horse-minio:9000
      }

      {$$MINIO_CONSOLE_DOMAIN} {
        reverse_proxy horse-minio:9001
      }
      CADDYFILE
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FE_DOMAIN: ${FE_DOMAIN:?Set FE_DOMAIN in this stack}
      FE_UPSTREAM: ${FE_UPSTREAM:?Set FE_UPSTREAM in this stack}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in this stack}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Set AUTH_DOMAIN in this stack}
      S3_DOMAIN: ${S3_DOMAIN:?Set S3_DOMAIN in this stack}
      MINIO_CONSOLE_DOMAIN: ${MINIO_CONSOLE_DOMAIN:?Set MINIO_CONSOLE_DOMAIN in this stack}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app

volumes:
  caddy_data:
  caddy_config:

networks:
  app:
    name: racehorse-net
    external: true
