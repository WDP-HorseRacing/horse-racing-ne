name: racehorse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: racehorse
      POSTGRES_USER: racehorse
      POSTGRES_PASSWORD: racehorse
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U racehorse -d racehorse']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # ── MinIO (S3-compatible Object Storage) ──
  minio:
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: racehorse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: RacehorseMinioAdmin # S3_MINIO_ACCESS_KEY_ID
      MINIO_ROOT_PASSWORD: Minio@#_Racehorse_WDP301_FPT_FA26 # S3_MINIO_SECRET_ACCESS_KEY
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web UI Console
    volumes:
      - minio-data:/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ['start-dev', '--http-port=8080']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: racehorse-admin-keycloak
      KEYCLOAK_ADMIN_PASSWORD: Keycloak@#_Racehorse_WDP301_FPT_FA26
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: racehorse
      KC_DB_PASSWORD: racehorse
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8088:8080'

volumes:
  postgres_data:
  redis_data:
  minio-data:
