x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - racehorse-network
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  race-horse-postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-racehorse}
      POSTGRES_USER: ${DB_USERNAME:-racehorse}
      POSTGRES_PASSWORD: racehorse
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true

  race-horse-redis:
    <<: *service-defaults
    image: redis:7-alpine
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - racehorse
    ports:
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a racehorse ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true

networks:
  racehorse-network:
    name: racehorse-network
    driver: bridge

volumes:
  # Keep the original volume keys so existing local database data remains usable.
  postgres_data:
  redis_data:
